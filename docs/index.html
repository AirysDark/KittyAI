<!DOCTYPE html>
<html>
<head>
    <title>KittyAI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>🐱 KittyAI</h1>

    <div id="chat">
        <div class="message bot">
            💕 Hi! I'm KittyAI. Ask me for a kitty photo.
        </div>
    </div>

    <div class="input-area">
        <input 
            id="userInput"
            placeholder="Ask for a kitty photo..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
